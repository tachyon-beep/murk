# cargo-deny configuration
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0176", reason = "pyo3 0.29 fixes this, but the latest published numpy crate is 0.28.0 and pins pyo3 0.28; remove once rust-numpy publishes a pyo3 0.29-compatible release" },
    { id = "RUSTSEC-2026-0177", reason = "pyo3 0.29 fixes this, but the latest published numpy crate is 0.28.0 and pins pyo3 0.28; remove once rust-numpy publishes a pyo3 0.29-compatible release" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
